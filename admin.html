
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Sayang Space</title>

<style>
:root {
  --pink: #f7a9c4;
  --deep: #a83c68;
  --bg: #fff7fa;
  --ink: #49313b;
  --muted: #8a737e;
  --line: #f2dce5;
  --new: #e44d79;
  --danger: #b42350;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
}

header {
  background: linear-gradient(135deg, #f8b8ce, #ffe1eb);
  padding: 18px 16px;
  border-bottom: 1px solid var(--line);
}

.head {
  max-width: 850px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

h1 { font-size: 21px; margin: 0 0 4px; }
.sub { font-size: 12px; color: #795765; }

.pill {
  background: white;
  border: 1px solid #f0c6d7;
  border-radius: 999px;
  padding: 7px 10px;
  font-size: 12px;
  white-space: nowrap;
}

main {
  max-width: 850px;
  margin: 16px auto;
  padding: 0 12px 28px;
}

.status {
  font-size: 12px;
  color: var(--muted);
  margin: 0 2px 12px;
}

.tabs {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 0 12px;
}

.tab {
  border: 1px solid var(--line);
  background: white;
  color: var(--deep);
  border-radius: 999px;
  padding: 8px 12px;
  font-weight: 650;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}

.tab.active {
  background: var(--deep);
  color: white;
  border-color: var(--deep);
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}

.toolbar h2 { font-size: 15px; margin: 0; }

.actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.smallbtn, .dangerbtn, .deletebtn {
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 650;
  cursor: pointer;
}

.smallbtn {
  border: 1px solid var(--line);
  background: white;
  color: var(--deep);
}

.dangerbtn, .deletebtn {
  border: 1px solid #f1b8c9;
  background: #fff0f5;
  color: var(--danger);
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.list {
  display: grid;
  gap: 9px;
}

.item {
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 12px 13px;
  box-shadow: 0 3px 12px #9e47600a;
  cursor: pointer;
  min-width: 0;
}

.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.itemtitle {
  font-weight: 750;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.when {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
}

.badges {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-shrink: 0;
}

.new {
  background: var(--new);
  color: white;
  font-weight: 800;
  font-size: 9px;
  padding: 3px 6px;
  border-radius: 999px;
}

.kind {
  font-size: 9px;
  background: #fff0f5;
  color: var(--deep);
  padding: 3px 6px;
  border-radius: 999px;
}

.detail {
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 7px;
}

.itemfoot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
}

.readhint {
  font-size: 10px;
  color: var(--muted);
}

.empty, .error {
  background: white;
  border: 1px dashed var(--line);
  border-radius: 13px;
  padding: 20px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.error {
  color: var(--danger);
  text-align: left;
}

@media (min-width: 620px) {
  .list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
</head>

<body>
<header>
  <div class="head">
    <div>
      <h1>🌷 Admin Sayang Space</h1>
      <div class="sub">Ringkasan pilihan makan & luahan sayang</div>
    </div>
    <div class="pill" id="newCount">0 baru</div>
  </div>
</header>

<main>
  <p class="status" id="status">Sedang sambung ke Firebase…</p>

  <div class="tabs">
    <button class="tab active" data-tab="all">✨ Semua</button>
    <button class="tab" data-tab="foodChoices">🍜 Pilihan makan</button>
    <button class="tab" data-tab="emotions">💗 Emosi</button>
    <button class="tab" data-tab="feelings">💌 Luahan</button>
  </div>

  <div class="toolbar">
    <h2 id="sectionTitle">Semua kiriman</h2>
    <div class="actions">
      <button class="smallbtn" id="markAll">Tanda dibaca</button>
      <button class="dangerbtn" id="clearAll">🗑️ Clear Semua</button>
    </div>
  </div>

  <div class="list" id="list">
    <div class="empty">Memuatkan data…</div>
  </div>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyDSFvZ3JtqTB7HP85WyRa5dka9VRUJdKDU",
  authDomain: "baby-7eec4.firebaseapp.com",
  databaseURL: "https://baby-7eec4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "baby-7eec4",
  storageBucket: "baby-7eec4.firebasestorage.app",
  messagingSenderId: "824621868036",
  appId: "1:824621868036:web:870a7c66e9311fb77ec151"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const paths = ["foodChoices", "emotions", "feelings"];

const titles = {
  all: "Semua kiriman",
  foodChoices: "Pilihan makan",
  emotions: "Emosi",
  feelings: "Luahan"
};

let activeTab = "all";
let records = [];
let loaded = new Set();

let readIds = new Set(
  JSON.parse(localStorage.getItem("sayangAdminReadIds") || "[]")
);

const list = document.getElementById("list");
const statusEl = document.getElementById("status");
const newCount = document.getElementById("newCount");

function firstValue(obj, keys) {
  for (const key of keys) {
    if (obj && obj[key] !== undefined &&
        obj[key] !== null && obj[key] !== "") {
      return obj[key];
    }
  }
  return null;
}

function timeValue(obj) {
  const raw = firstValue(obj, [
    "timestamp", "createdAt", "created_at",
    "time", "date", "sentAt", "submittedAt"
  ]);

  if (raw === null) return 0;

  if (typeof raw === "number") {
    return raw < 1000000000000 ? raw * 1000 : raw;
  }

  const number = Number(raw);

  if (Number.isFinite(number) && number > 0) {
    return number < 1000000000000 ? number * 1000 : number;
  }

  const parsed = Date.parse(raw);
  return Number.isNaN(parsed) ? 0 : parsed;
}

function formatTime(ms) {
  if (!ms) return "Masa tidak direkod";

  return new Intl.DateTimeFormat("ms-MY", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(new Date(ms));
}

function textFor(obj) {
  if (typeof obj === "string" || typeof obj === "number") {
    return String(obj);
  }

  if (!obj || typeof obj !== "object") {
    return "Kiriman baharu";
  }

  const labels = {
    food: "Makanan",
    foodName: "Makanan",
    menu: "Menu",
    choice: "Pilihan",
    selectedFood: "Makanan",
    makanan: "Makanan",
    message: "Mesej",
    text: "Mesej",
    feeling: "Luahan",
    luahan: "Luahan",
    description: "Catatan",
    note: "Catatan",
    emotion: "Emosi",
    mood: "Mood",
    name: "Nama"
  };

  const preferred = Object.keys(labels);
  const lines = [];

  for (const key of preferred) {
    const value = obj[key];

    if (value !== undefined && value !== null &&
        (typeof value === "string" || typeof value === "number") &&
        String(value).trim()) {
      lines.push(labels[key] + ": " + String(value));
    }
  }

  if (!lines.length) {
    for (const [key, value] of Object.entries(obj)) {
      if (
        value !== null &&
        value !== undefined &&
        ![
          "timestamp", "createdAt", "created_at",
          "time", "date", "sentAt", "submittedAt"
        ].includes(key) &&
        ["string", "number", "boolean"].includes(typeof value)
      ) {
        lines.push(
          key.replace(/([A-Z])/g, " $1") + ": " + String(value)
        );
      }
    }
  }

  return lines.length ? lines.join("\n") : "Kiriman diterima";
}

function saveRead() {
  localStorage.setItem(
    "sayangAdminReadIds",
    JSON.stringify([...readIds])
  );
}

function render() {
  const filtered = records
    .filter(r => activeTab === "all" || r.path === activeTab)
    .sort((a, b) => b.ms - a.ms);

  const unread = records.filter(r => !readIds.has(r.id)).length;
  newCount.textContent = `${unread} baru`;

  document.getElementById("sectionTitle").textContent =
    titles[activeTab];

  if (!filtered.length) {
    list.innerHTML = "";

    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent =
      "Belum ada data untuk bahagian ini.";

    list.append(empty);
    return;
  }

  list.replaceChildren();

  for (const r of filtered) {
    const card = document.createElement("article");
    card.className = "item";
    card.tabIndex = 0;

    const top = document.createElement("div");
    top.className = "top";

    const left = document.createElement("div");

    const title = document.createElement("div");
    title.className = "itemtitle";
    title.textContent = r.title;

    const when = document.createElement("div");
    when.className = "when";
    when.textContent = formatTime(r.ms);

    left.append(title, when);

    const badges = document.createElement("div");
    badges.className = "badges";

    if (!readIds.has(r.id)) {
      const badge = document.createElement("span");
      badge.className = "new";
      badge.textContent = "NEW";
      badges.append(badge);
    }

    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = r.label;

    badges.append(kind);
    top.append(left, badges);

    const detail = document.createElement("div");
    detail.className = "detail";
    detail.textContent = r.detail;

    const foot = document.createElement("div");
    foot.className = "itemfoot";

    const hint = document.createElement("span");
    hint.className = "readhint";
    hint.textContent = readIds.has(r.id)
      ? "Sudah dibaca"
      : "Tekan kad untuk tanda dibaca";

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "deletebtn";
    deleteBtn.textContent = "🗑️ Padam";

    deleteBtn.addEventListener("click", async (event) => {
      event.stopPropagation();

      const confirmed = confirm(
        "Padam kiriman ini secara kekal? Tindakan ini tidak boleh dibatalkan."
      );

      if (!confirmed) return;

      deleteBtn.disabled = true;
      deleteBtn.textContent = "Memadam…";

      try {
        await remove(ref(db, r.path + "/" + r.key));

        readIds.delete(r.id);
        saveRead();
      } catch (error) {
        alert("Gagal memadam: " + error.message);
        deleteBtn.disabled = false;
        deleteBtn.textContent = "🗑️ Padam";
      }
    });

    foot.append(hint, deleteBtn);
    card.append(top, detail, foot);

    const markRead = () => {
      if (!readIds.has(r.id)) {
        readIds.add(r.id);
        saveRead();
        render();
      }
    };

    card.addEventListener("click", markRead);

    card.addEventListener("keydown", event => {
      if (event.key === "Enter") markRead();
    });

    list.append(card);
  }
}

function ingest(path, value) {
  const arr = [];

  if (value && typeof value === "object") {
    for (const [key, obj] of Object.entries(value)) {
      const id = path + ":" + key;

      arr.push({
        id,
        key,
        path,
        label: path === "foodChoices"
          ? "MAKAN"
          : path === "emotions" ? "EMOSI" : "LUAHAN",
        title: path === "foodChoices"
          ? "🍜 Pilihan makan"
          : path === "emotions" ? "💗 Emosi" : "💌 Luahan",
        detail: textFor(obj),
        ms: timeValue(obj)
      });
    }
  }

  records = records.filter(r => r.path !== path).concat(arr);
  loaded.add(path);

  statusEl.textContent = loaded.size === paths.length
    ? "🟢 Firebase disambungkan"
    : "Sedang memuatkan data…";

  render();
}

for (const path of paths) {
  onValue(
    ref(db, path),
    snapshot => ingest(path, snapshot.val()),
    error => {
      statusEl.textContent = "Ralat Firebase: " + error.message;
      list.innerHTML = "";

      const errorBox = document.createElement("div");
      errorBox.className = "error";
      errorBox.textContent =
        "Tak dapat membaca atau memadam data. Semak Firebase config dan Database Rules.";

      list.append(errorBox);
    }
  );
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.toggle("active", tab === button);
    });

    activeTab = button.dataset.tab;
    render();
  });
});

document.getElementById("markAll").addEventListener("click", () => {
  records.forEach(r => readIds.add(r.id));
  saveRead();
  render();
});

document.getElementById("clearAll").addEventListener("click", async () => {
  if (!records.length) {
    alert("Tiada data untuk dipadam.");
    return;
  }

  const confirmed = confirm(
    "AMARAN! Padam SEMUA data dalam foodChoices, emotions dan feelings? Data yang dipadam tidak boleh dipulihkan. Teruskan?"
  );

  if (!confirmed) return;

  const button = document.getElementById("clearAll");
  button.disabled = true;
  button.textContent = "Memadam…";

  try {
    await Promise.all(
      paths.map(path => remove(ref(db, path)))
    );

    readIds.clear();
    saveRead();

    alert("Semua data berjaya dipadam!");
  } catch (error) {
    alert(
      "Gagal memadam semua data: " + error.message +
      "\nSemak Firebase Database Rules."
    );
  } finally {
    button.disabled = false;
    button.textContent = "🗑️ Clear Semua";
  }
});
</script>
</body>
</html>
