
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sayang Eats 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #fff5f8;
      color: #482b39;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      text-align: center;
      background: #ffdce8;
      padding: 25px 15px;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 8px;
      color: #a83268;
    }

    header p {
      margin: 0;
      color: #704257;
    }

    .status {
      background: white;
      border: 1px solid #f2c8d8;
      padding: 13px;
      border-radius: 14px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .section {
      background: white;
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px #e8bdcc55;
    }

    .section h2 {
      color: #a83268;
      margin-top: 0;
    }

    .item {
      background: #fff5f8;
      border: 1px solid #f4d6e1;
      border-radius: 14px;
      padding: 15px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .item h3 {
      color: #a83268;
      margin: 0 0 10px;
      font-size: 16px;
    }

    .item p {
      margin: 7px 0;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .time {
      color: #876778;
      font-size: 12px;
      margin-top: 10px;
    }

    .empty {
      color: #876778;
      text-align: center;
      padding: 20px 5px;
    }

    .refresh {
      background: #c94f83;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .refresh:hover {
      background: #a83268;
    }

    footer {
      text-align: center;
      color: #876778;
      font-size: 12px;
      padding: 15px;
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>💗 Sayang Eats</h1>
      <p>Dashboard Admin — Ruang Khas Untuk Sayang 🌷</p>
    </header>

    <div class="status" id="status">
      🔄 Sedang menyambung ke Firebase...
    </div>

    <button class="refresh" id="refreshBtn">
      ↻ Muat Semula
    </button>

    <section class="section">
      <h2>🍜 Pilihan Makanan</h2>
      <div id="foodList">
        <p class="empty">Memuatkan data...</p>
      </div>
    </section>

    <section class="section">
      <h2>💗 Pilihan Perasaan</h2>
      <div id="emotionList">
        <p class="empty">Memuatkan data...</p>
      </div>
    </section>

    <section class="section">
      <h2>📝 Ruang Luahan</h2>
      <div id="feelingList">
        <p class="empty">Memuatkan data...</p>
      </div>
    </section>

    <footer>
      Dibuat dengan penuh kasih sayang 💕
    </footer>

  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    /*
      PENTING:
      Gantikan konfigurasi di bawah dengan firebaseConfig
      yang SAMA seperti dalam index.html app kau.
    */

    const firebaseConfig = {
      apiKey: "MASUKKAN_API_KEY_KAU",
      authDomain: "baby-7eec4.firebaseapp.com",
      databaseURL: "https://baby-7eec4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "baby-7eec4"
    };

    const statusBox = document.getElementById("status");

    const sections = {
      foodChoices: document.getElementById("foodList"),
      emotions: document.getElementById("emotionList"),
      feelings: document.getElementById("feelingList")
    };

    // Paparkan teks dengan selamat tanpa mentafsirnya sebagai HTML.
    function makeText(tag, text, className = "") {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      return element;
    }

    function formatLabel(key) {
      return String(key)
        .replace(/([A-Z])/g, " $1")
        .replace(/[_-]/g, " ")
        .replace(/^./, c => c.toUpperCase());
    }

    function formatValue(value) {
      if (value === null) return "—";

      if (typeof value === "object") {
        return JSON.stringify(value, null, 2);
      }

      return String(value);
    }

    function renderData(container, data, type) {
      container.replaceChildren();

      if (!data || typeof data !== "object") {
        container.append(
          makeText("p", "Belum ada data untuk dipaparkan.", "empty")
        );
        return;
      }

      const entries = Object.entries(data).reverse();

      if (entries.length === 0) {
        container.append(
          makeText("p", "Belum ada data untuk dipaparkan.", "empty")
        );
        return;
      }

      for (const [key, value] of entries) {
        const card = document.createElement("article");
        card.className = "item";

        card.append(
          makeText("h3", type)
        );

        if (value && typeof value === "object") {
          for (const [field, fieldValue] of Object.entries(value)) {
            // Elakkan memaparkan metadata sebagai kandungan utama.
            const label = formatLabel(field);
            const p = makeText(
              "p",
              label + ": " + formatValue(fieldValue)
            );
            card.append(p);
          }
        } else {
          card.append(makeText("p", formatValue(value)));
        }

        card.append(
          makeText("p", "ID rekod: " + key, "time")
        );

        container.append(card);
      }
    }

    let db;

    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);

      let connected = false;

      onValue(
        ref(db, ".info/connected"),
        snapshot => {
          connected = snapshot.val() === true;

          if (connected) {
            statusBox.textContent =
              "🟢 Disambungkan ke Firebase. Data dikemas kini secara langsung.";
          } else {
            statusBox.textContent =
              "🟠 Sambungan terputus. Sedang menunggu sambungan semula...";
          }
        }
      );

      const pathNames = {
        foodChoices: "🍜 Rekod Makanan",
        emotions: "💗 Rekod Perasaan",
        feelings: "📝 Rekod Luahan"
      };

      for (const [path, container] of Object.entries(sections)) {
        onValue(
          ref(db, path),
          snapshot => {
            renderData(container, snapshot.val(), pathNames[path]);
          },
          error => {
            container.replaceChildren(
              makeText(
                "p",
                "Tak dapat membaca data: " + error.message,
                "empty"
              )
            );
          }
        );
      }

      document.getElementById("refreshBtn").addEventListener(
        "click",
        () => window.location.reload()
      );

    } catch (error) {
      statusBox.textContent =
        "❌ Ralat Firebase: " + error.message;
    }
  </script>
</body>
</html>
