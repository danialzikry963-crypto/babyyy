
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Sayang Eats 💗</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;font-family:Arial,sans-serif;
  background:#fff5f8;color:#482b39
}
.container{max-width:900px;margin:auto}
header{
  text-align:center;background:#ffdce8;padding:25px 15px;
  border-radius:22px;margin-bottom:18px
}
h1,h2,h3{color:#a83268}
header h1{margin:0 0 8px}
header p{margin:0;color:#704257}
.status,.section{
  background:white;border:1px solid #f2c8d8;
  border-radius:17px;padding:16px;margin-bottom:18px
}
.section{box-shadow:0 4px 15px #e8bdcc30}
.section h2{margin-top:0}
button{
  border:0;border-radius:12px;padding:12px 17px;
  background:#c94f83;color:white;cursor:pointer;
  font-size:14px;margin-bottom:18px
}
.item{
  background:#fff5f8;border:1px solid #f4d6e1;
  border-radius:13px;padding:14px;margin:10px 0;
  overflow-wrap:anywhere
}
.item h3{font-size:15px;margin:0 0 8px}
.item p{white-space:pre-wrap;line-height:1.5;margin:7px 0}
.small{font-size:12px;color:#876778}
.empty{text-align:center;color:#876778;padding:15px 5px}
footer{text-align:center;color:#876778;font-size:12px;padding:15px}
</style>
</head>

<body>
<main class="container">
<header>
  <h1>💗 Sayang Eats</h1>
  <p>Dashboard Admin — Ruang Khas Untuk Sayang 🌷</p>
</header>

<div class="status" id="status">
  🔄 Sedang menyambung ke Firebase...
</div>

<button id="refreshBtn">↻ Muat Semula</button>

<section class="section">
  <h2>🍜 Pilihan Makanan</h2>
  <div id="foodList"><p class="empty">Memuatkan data...</p></div>
</section>

<section class="section">
  <h2>💗 Pilihan Perasaan</h2>
  <div id="emotionList"><p class="empty">Memuatkan data...</p></div>
</section>

<section class="section">
  <h2>📝 Ruang Luahan</h2>
  <div id="feelingList"><p class="empty">Memuatkan data...</p></div>
</section>

<footer>Dibuat dengan penuh kasih sayang 💕</footer>
</main>

<script type="module">
const statusBox = document.getElementById("status");

function showError(message) {
  statusBox.textContent = "❌ " + message;
}

function makeText(tag, text, className = "") {
  const el = document.createElement(tag);
  el.textContent = text;
  if (className) el.className = className;
  return el;
}

function renderData(container, data, title) {
  container.replaceChildren();

  if (!data || typeof data !== "object" ||
      Object.keys(data).length === 0) {
    container.append(
      makeText("p", "Belum ada data untuk dipaparkan.", "empty")
    );
    return;
  }

  Object.entries(data).reverse().forEach(([key, value]) => {
    const card = document.createElement("article");
    card.className = "item";
    card.append(makeText("h3", title));

    if (value && typeof value === "object") {
      Object.entries(value).forEach(([field, fieldValue]) => {
        let display;
        try {
          display = typeof fieldValue === "object"
            ? JSON.stringify(fieldValue, null, 2)
            : String(fieldValue ?? "—");
        } catch {
          display = String(fieldValue);
        }

        card.append(makeText("p", field + ": " + display));
      });
    } else {
      card.append(makeText("p", String(value ?? "—")));
    }

    card.append(makeText("p", "ID: " + key, "small"));
    container.append(card);
  });
}

document.getElementById("refreshBtn").onclick = () => location.reload();

async function startAdmin() {
  try {
    const { initializeApp } = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
    );
    const { getDatabase, ref, onValue } = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
    );

    /*
      PENTING:
      Gantikan keseluruhan config di bawah dengan
      config sebenar daripada index.html kau.
    */
    const firebaseConfig = {
        apiKey: "AIzaSyDSFvZ3JtqTB7HP85WyRa5dka9VRUJdKDU",
      authDomain: "baby-7eec4.firebaseapp.com",
      databaseURL: "https://baby-7eec4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "baby-7eec4"
    };

    if (firebaseConfig.apiKey === "GANTI_DENGAN_API_KEY_SEBENAR") {
      showError("Masukkan apiKey sebenar daripada index.html.");
      return;
    }

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, ".info/connected"), snapshot => {
      statusBox.textContent = snapshot.val()
        ? "🟢 Firebase bersambung."
        : "🟠 Menunggu sambungan Firebase...";
    }, error => showError(error.message));

    const lists = [
      ["foodChoices", "foodList", "🍜 Rekod Makanan"],
      ["emotions", "emotionList", "💗 Rekod Perasaan"],
      ["feelings", "feelingList", "📝 Rekod Luahan"]
    ];

    lists.forEach(([path, elementId, title]) => {
      const container = document.getElementById(elementId);

      onValue(ref(db, path), snapshot => {
        renderData(container, snapshot.val(), title);
      }, error => {
        container.replaceChildren(
          makeText("p", "Gagal membaca data: " + error.message, "empty")
        );
      });
    });
  } catch (error) {
    console.error(error);
    showError("Firebase gagal dimulakan: " + error.message);
  }
}

startAdmin();
</script>
</body>
</html>
